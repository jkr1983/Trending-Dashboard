version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trendpulse-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
    expose:
      - "3001"
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - trendpulse-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trendpulse-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trendpulse-net

  # Run with: docker compose --profile test run --rm test
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: trendpulse-test
    environment:
      - NODE_ENV=test
      - YOUTUBE_API_KEY=test-youtube-key
      - LOG_LEVEL=silent
    networks:
      - trendpulse-net
    profiles:
      - test

networks:
  trendpulse-net:
    driver: bridge
